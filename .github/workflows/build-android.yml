name: Build Android APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Java (JDK 17) kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Keystore'u geri yükle
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore
          ls -la android.keystore

      # Bubblewrap CLI YOK — Android projesini kendimiz üretiyoruz.
      # Sebep: bubblewrap init CI'da interaktif sorularla takılıyor
      # (GoogleChromeLabs/bubblewrap#806, hâlâ açık bir hata).
      - name: TWA Android projesini üret
        run: bash .github/scripts/generate-android-project.sh

      - name: Gradle ile build et (APK + AAB)
        working-directory: android-project
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: mindgap
        run: |
          gradle --no-daemon assembleRelease bundleRelease

      - name: Üretilen dosyaları listele
        if: always()
        run: find android-project -type f \( -name "*.apk" -o -name "*.aab" \) || echo "hiç apk/aab yok"

      - name: APK ve AAB yollarını bul
        id: find_files
        run: |
          echo "apk_path=$(find android-project -name '*.apk' | head -n1)" >> "$GITHUB_OUTPUT"
          echo "aab_path=$(find android-project -name '*.aab' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Artifact olarak yükle (APK)
        if: steps.find_files.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: mindgap-apk
          path: ${{ steps.find_files.outputs.apk_path }}

      - name: Artifact olarak yükle (AAB)
        if: steps.find_files.outputs.aab_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: mindgap-aab
          path: ${{ steps.find_files.outputs.aab_path }}
