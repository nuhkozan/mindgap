name: Build Android APK & AAB

# Ne zaman çalışır:
# - main branch'e push olduğunda
# - Actions sekmesinden manuel "Run workflow" ile de tetiklenebilir
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # tüm job en fazla 20dk sürsün, takılırsa otomatik durur

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Java (JDK 17) kur — Android build için gerekli
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Android SDK'yı ÖNCEDEN kuruyoruz ki Bubblewrap "SDK indireyim mi?"
      # diye sormasın — bu, takılmanın en olası sebebiydi.
      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bubblewrap CLI kur
        run: npm install -g @bubblewrap/cli

      - name: Keystore'u geri yükle
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      # ANDROID_HOME zaten setup-android action'ı tarafından ayarlanıyor,
      # bu yüzden Bubblewrap "SDK nerede?" diye sormayacak.
      - name: TWA projesini oluştur (init)
        timeout-minutes: 8
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes "n" | bubblewrap init \
            --manifest="https://nuhkozan.github.io/mindgap/manifest.json" \
            --directory="./twa-project" \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="$ANDROID_HOME" \
            2>&1 | tee init.log
          echo "---- init tamamlandı ----"

      - name: init.log içeriğini göster (hata ayıklama için)
        if: always()
        run: cat init.log || echo "init.log bulunamadı"

      - name: twa-project klasörünü listele (hata ayıklama için)
        if: always()
        run: ls -la ./twa-project || echo "twa-project klasörü oluşmamış"

      - name: twa-manifest.json'ı proje klasörüne kopyala
        run: cp twa-manifest.json ./twa-project/twa-manifest.json

      - name: keystore'u proje klasörüne kopyala
        run: cp android.keystore ./twa-project/android.keystore

      - name: TWA'yı build et (APK + AAB üret)
        timeout-minutes: 8
        working-directory: ./twa-project
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          yes "n" | bubblewrap build \
            --skipPwaValidation \
            2>&1 | tee ../build.log

      - name: build.log içeriğini göster (hata ayıklama için)
        if: always()
        run: cat build.log || echo "build.log bulunamadı"

      - name: APK ve AAB dosyalarını bul
        id: find_files
        run: |
          echo "apk_path=$(find ./twa-project -name '*.apk' | head -n1)" >> "$GITHUB_OUTPUT"
          echo "aab_path=$(find ./twa-project -name '*.aab' | head -n1)" >> "$GITHUB_OUTPUT"
          echo "Bulunan APK: $(find ./twa-project -name '*.apk')"
          echo "Bulunan AAB: $(find ./twa-project -name '*.aab')"

      - name: Artifact olarak yükle (APK)
        if: steps.find_files.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: mindgap-apk
          path: ${{ steps.find_files.outputs.apk_path }}

      - name: Artifact olarak yükle (AAB)
        if: steps.find_files.outputs.aab_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: mindgap-aab
          path: ${{ steps.find_files.outputs.aab_path }}

      - name: GitHub Release oluştur (opsiyonel)
        if: github.ref == 'refs/heads/main' && steps.find_files.outputs.apk_path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MIND GAP build #${{ github.run_number }}"
          files: |
            ${{ steps.find_files.outputs.apk_path }}
            ${{ steps.find_files.outputs.aab_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
