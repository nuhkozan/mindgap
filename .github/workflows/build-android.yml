name: Build Android APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Java (JDK 17) kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bubblewrap CLI kur
        run: npm install -g @bubblewrap/cli

      - name: Keystore'u geri yükle
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      # 1) init: gerçek Bubblewrap akışını kullanıyoruz (elle klasör kurmuyoruz),
      #    JDK/SDK zaten kurulu olduğu için o sorular çıkmayacak.
      #    "n" ile tüm soruları güvenli varsayılanla geçiyoruz.
      - name: TWA projesini oluştur (init)
        timeout-minutes: 6
        run: |
          timeout 300 bash -c '
            printf "n\nn\nn\nn\nn\nn\nn\nn\nn\nn\n" | bubblewrap init \
              --manifest="https://nuhkozan.github.io/mindgap/manifest.json" \
              --directory="./twa-project"
          ' 2>&1 | tee init.log
          echo "---- init bitti ----"

      - name: init.log göster
        if: always()
        run: cat init.log || true

      - name: twa-project içeriği
        if: always()
        run: ls -la ./twa-project 2>&1 || echo "klasör yok"

      # 2) Bizim elle hazırladığımız twa-manifest.json'ı (doğru signingKey
      #    ayarlarıyla) init'in ürettiğinin üzerine yazıyoruz.
      - name: twa-manifest.json'ı proje klasörüne kopyala
        run: |
          cp twa-manifest.json ./twa-project/twa-manifest.json
          cp android.keystore ./twa-project/android.keystore

      # 3) build: resmi ortam değişkenleri BUBBLEWRAP_KEYSTORE_PASSWORD ve
      #    BUBBLEWRAP_KEY_PASSWORD kullanılıyor (Bubblewrap dokümantasyonuna göre).
      #    "n" cevabı: "checksum uyuşmuyor, yeniden oluşturayım mı?" sorusuna
      #    HAYIR diyoruz — çünkü manifest'i biz kasıtlı olarak değiştirdik,
      #    projeyi yeniden oluşturmasın, olduğu gibi build etsin istiyoruz.
      - name: TWA'yı build et (APK + AAB üret)
        timeout-minutes: 10
        working-directory: ./twa-project
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          timeout 540 bash -c '
            printf "n\nn\nn\nn\nn\n" | bubblewrap build --skipPwaValidation
          ' 2>&1 | tee ../build.log
          echo "---- build bitti ----"

      - name: build.log göster
        if: always()
        run: cat build.log || true

      - name: twa-project TÜM dosyaları listele (derin arama)
        if: always()
        run: find ./twa-project -type f \( -name "*.apk" -o -name "*.aab" \) 2>&1 || echo "hiçbir apk/aab yok"

      - name: APK ve AAB dosyalarını bul
        id: find_files
        run: |
          echo "apk_path=$(find ./twa-project -name '*.apk' | head -n1)" >> "$GITHUB_OUTPUT"
          echo "aab_path=$(find ./twa-project -name '*.aab' | head -n1)" >> "$GITHUB_OUTPUT"
          echo "Bulunan APK: $(find ./twa-project -name '*.apk')"
          echo "Bulunan AAB: $(find ./twa-project -name '*.aab')"

      - name: Artifact olarak yükle (APK)
        if: steps.find_files.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: mindgap-apk
          path: ${{ steps.find_files.outputs.apk_path }}

      - name: Artifact olarak yükle (AAB)
        if: steps.find_files.outputs.aab_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: mindgap-aab
          path: ${{ steps.find_files.outputs.aab_path }}
