name: Build Android APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Java (JDK 17) kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node-pty için build araçlarını kur (native derleme ihtiyacı olursa)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential python3

      - name: Bubblewrap CLI kur (global)
        run: npm install -g @bubblewrap/cli

      - name: PTY otomasyon scripti bağımlılıklarını kur
        working-directory: .github/scripts
        run: npm install

      - name: Keystore'u geri yükle
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: JDK/SDK yollarını doğrula (erken hata tespiti)
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -z "$JAVA_HOME" ]; then echo "!!! JAVA_HOME boş !!!"; exit 1; fi
          if [ -z "$ANDROID_HOME" ]; then echo "!!! ANDROID_HOME boş !!!"; exit 1; fi

      # ── PTY üzerinden bubblewrap init ──
      # Gerçek bir pseudo-terminal simüle ederek Bubblewrap'in interaktif
      # sorularını çıktıyı canlı izleyip doğru cevaplarla geçiyoruz.
      # Bu, "yes |" / "printf |" pipe yaklaşımının TTY olmaması yüzünden
      # yaşadığımız tutarsız/sonsuz-döngü sorunlarını çözüyor.
      - name: TWA projesini oluştur (init, PTY ile)
        timeout-minutes: 10
        run: |
          node .github/scripts/run-bubblewrap.js \
            "bubblewrap init --manifest=\"https://nuhkozan.github.io/mindgap/manifest.json\" --directory=\"./twa-project\"" \
            "$(pwd)" \
            2>&1 | tee init.log
          echo "==== init.log sonu ===="

      - name: twa-project içeriği (hata ayıklama)
        if: always()
        run: ls -la ./twa-project 2>&1 || echo "twa-project klasörü oluşmamış"

      # Bizim elle hazırladığımız twa-manifest.json'ı (doğru signingKey
      # ayarlarıyla) init'in ürettiğinin üzerine yazıyoruz.
      - name: twa-manifest.json ve keystore'u proje klasörüne kopyala
        run: |
          cp twa-manifest.json ./twa-project/twa-manifest.json
          cp android.keystore ./twa-project/android.keystore

      # ── PTY üzerinden bubblewrap build ──
      - name: TWA'yı build et (APK + AAB üret, PTY ile)
        timeout-minutes: 10
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          node .github/scripts/run-bubblewrap.js \
            "bubblewrap build --skipPwaValidation" \
            "$(pwd)/twa-project" \
            2>&1 | tee build.log
          echo "==== build.log sonu ===="

      - name: build.log göster
        if: always()
        run: cat build.log || true

      - name: twa-project TÜM apk/aab dosyaları (derin arama)
        if: always()
        run: find ./twa-project -type f \( -name "*.apk" -o -name "*.aab" \) 2>&1 || echo "hiç apk/aab yok"

      - name: APK ve AAB dosyalarını bul
        id: find_files
        run: |
          echo "apk_path=$(find ./twa-project -name '*.apk' | head -n1)" >> "$GITHUB_OUTPUT"
          echo "aab_path=$(find ./twa-project -name '*.aab' | head -n1)" >> "$GITHUB_OUTPUT"
          echo "Bulunan APK: $(find ./twa-project -name '*.apk')"
          echo "Bulunan AAB: $(find ./twa-project -name '*.aab')"

      - name: Artifact olarak yükle (APK)
        if: steps.find_files.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: mindgap-apk
          path: ${{ steps.find_files.outputs.apk_path }}

      - name: Artifact olarak yükle (AAB)
        if: steps.find_files.outputs.aab_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: mindgap-aab
          path: ${{ steps.find_files.outputs.aab_path }}
