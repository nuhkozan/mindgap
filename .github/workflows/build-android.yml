name: Build Android APK & AAB

# Ne zaman çalışır:
# - main branch'e push olduğunda
# - Actions sekmesinden manuel "Run workflow" ile de tetiklenebilir
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # tüm job en fazla 20dk sürsün, takılırsa otomatik durur

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Java (JDK 17) kur — Android build için gerekli
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Android SDK'yı ÖNCEDEN kuruyoruz ki Bubblewrap "SDK indireyim mi?"
      # diye sormasın — bu, takılmanın en olası sebebiydi.
      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bubblewrap CLI kur
        run: npm install -g @bubblewrap/cli

      - name: Keystore'u geri yükle
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      # Bubblewrap'in "ilk kurulum" sorularını (JDK/SDK indirsin mi?) HİÇ
      # sormaması için, kendi global config dosyasını elle önceden yazıyoruz.
      # Böylece "init" adımına hiç gerek kalmıyor — CLI zaten yapılandırılmış
      # sayıyor ve doğrudan build'e geçebiliyor.
      - name: Bubblewrap global config'ini önceden yaz (soruları atla)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          echo "Yazılan config:"
          cat "$HOME/.bubblewrap/config.json"

      # Proje klasörünü elle kuruyoruz (init'e gerek yok): bizim hazır
      # twa-manifest.json'ımızı ve keystore'u doğrudan oraya koyuyoruz.
      - name: TWA proje klasörünü hazırla
        run: |
          mkdir -p ./twa-project
          cp twa-manifest.json ./twa-project/twa-manifest.json
          cp android.keystore ./twa-project/android.keystore
          echo "Proje klasörü içeriği:"
          ls -la ./twa-project

      - name: TWA'yı build et (APK + AAB üret)
        timeout-minutes: 10
        working-directory: ./twa-project
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          timeout 480 bash -c '
            yes "" | bubblewrap build --skipPwaValidation
          ' 2>&1 | tee ../build.log
          echo "---- build adımı bitti (exit: $?) ----"

      - name: build.log içeriğini göster (hata ayıklama için)
        if: always()
        run: cat build.log || echo "build.log bulunamadı"

      - name: APK ve AAB dosyalarını bul
        id: find_files
        run: |
          echo "apk_path=$(find ./twa-project -name '*.apk' | head -n1)" >> "$GITHUB_OUTPUT"
          echo "aab_path=$(find ./twa-project -name '*.aab' | head -n1)" >> "$GITHUB_OUTPUT"
          echo "Bulunan APK: $(find ./twa-project -name '*.apk')"
          echo "Bulunan AAB: $(find ./twa-project -name '*.aab')"

      - name: Artifact olarak yükle (APK)
        if: steps.find_files.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: mindgap-apk
          path: ${{ steps.find_files.outputs.apk_path }}

      - name: Artifact olarak yükle (AAB)
        if: steps.find_files.outputs.aab_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: mindgap-aab
          path: ${{ steps.find_files.outputs.aab_path }}

      - name: GitHub Release oluştur (opsiyonel)
        if: github.ref == 'refs/heads/main' && steps.find_files.outputs.apk_path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MIND GAP build #${{ github.run_number }}"
          files: |
            ${{ steps.find_files.outputs.apk_path }}
            ${{ steps.find_files.outputs.aab_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
